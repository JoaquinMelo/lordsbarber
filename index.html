<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lord's Barber Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #14201A;
    --bg: #1F3329;
    --cream: #F2E9D8;
    --brass: #C89B3C;
    --red: #A23E32;
    --stripe: #E8DFC8;
    --line: rgba(242,233,216,0.14);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    min-height:100%;
    background: var(--bg-deep);
    color: var(--cream);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    background:
      radial-gradient(circle at 50% -10%, rgba(200,155,60,0.10), transparent 55%),
      var(--bg-deep);
    display:flex;
    justify-content:center;
    padding: 56px 20px 40px;
  }

  .page{
    width:100%;
    max-width: 460px;
  }

  /* --- Barber pole stripe divider: the signature element --- */
  .pole-stripe{
    height: 10px;
    width:100%;
    border-radius: 6px;
    background: repeating-linear-gradient(
      -45deg,
      var(--red) 0 14px,
      var(--stripe) 14px 28px,
      var(--bg) 28px 42px
    );
    box-shadow: 0 2px 0 rgba(0,0,0,0.25) inset;
  }

  header{
    text-align:center;
    margin: 30px 0 34px;
  }

  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 14px;
  }

  h1{
    font-family:'Oswald', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    font-size: clamp(34px, 9vw, 44px);
    letter-spacing: 1px;
    line-height: 1.05;
    margin: 0 0 10px;
  }

  h1 span{ color: var(--brass); }

  .tagline{
    font-size: 14.5px;
    color: rgba(242,233,216,0.72);
    max-width: 320px;
    margin: 0 auto;
  }

  /* --- Avatar / emblem --- */
  .emblem{
    width: 84px;
    height: 84px;
    margin: 22px auto 0;
    border-radius: 50%;
    border: 2px solid var(--brass);
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--bg);
  }

  .emblem svg{ width: 40px; height: 40px; }

  /* --- Link "ticket" buttons --- */
  nav{
    display:flex;
    flex-direction:column;
    gap: 14px;
  }

  .ticket{
    position: relative;
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 16px 18px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    text-decoration:none;
    color: var(--cream);
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }

  .ticket:hover,
  .ticket:focus-visible{
    transform: translateY(-2px);
    border-color: var(--brass);
    background: #24392D;
  }

  .ticket:focus-visible{
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }

  .ticket .icon{
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(200,155,60,0.12);
    color: var(--brass);
  }

  .ticket .icon svg{ width: 20px; height: 20px; }

  .ticket .text{ flex:1; min-width:0; }

  .ticket .label{
    font-family:'Oswald', sans-serif;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: .3px;
    text-transform: uppercase;
  }

  .ticket .sub{
    font-size: 12.5px;
    color: rgba(242,233,216,0.6);
    margin-top: 1px;
  }

  .ticket .arrow{
    flex: 0 0 auto;
    color: var(--brass);
    font-size: 18px;
    opacity: .8;
  }

  /* perforated ticket edge */
  .ticket::before{
    content:"";
    position:absolute;
    left: 66px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: repeating-linear-gradient(
      to bottom,
      var(--line) 0 4px,
      transparent 4px 9px
    );
  }

  footer{
    margin-top: 34px;
    text-align:center;
  }

  .hours{
    font-family:'Space Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(242,233,216,0.5);
  }

  .pole-stripe.bottom{ margin-top: 22px; }

  /* --- Team section --- */
  .team{
    margin-top: 38px;
  }

  .section-title{
    font-family:'Oswald', sans-serif;
    text-transform: uppercase;
    font-size: 13px;
    letter-spacing: 2.5px;
    color: var(--brass);
    text-align:center;
    margin: 0 0 16px;
  }

  .team-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .barber{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-decoration:none;
    color: var(--cream);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 8px 12px;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }

  .barber:hover,
  .barber:focus-visible{
    transform: translateY(-2px);
    border-color: var(--brass);
    background: #24392D;
  }

  .barber:focus-visible{
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }

  .barber .photo{
    width: 64px;
    height: 64px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--brass);
    margin-bottom: 9px;
    background: #24392D;
  }

  .barber .name{
    font-family:'Oswald', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  .barber .cta{
    font-family:'Space Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(242,233,216,0.55);
    margin-top: 3px;
  }

  @media (max-width: 360px){
    .barber .name{ font-size: 12px; }
  }

  @media (prefers-reduced-motion: no-preference){
    .ticket{ transition: transform .15s ease, border-color .15s ease, background .15s ease; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="pole-stripe" aria-hidden="true"></div>

  <header>
    <div class="eyebrow">Los Ángeles · Chile</div>
    <h1>Lord's<br><span>Barber Shop</span></h1>
    <p class="tagline">Cortes clásicos, afeitado a navaja y estilo con historia.</p>

    <div class="emblem" aria-hidden="true">
      <!-- scissors icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#C89B3C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="3"></circle>
        <circle cx="6" cy="18" r="3"></circle>
        <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
        <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
        <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
      </svg>
    </div>
  </header>

  <nav>
    <!-- EDITA los href de abajo con tus links reales -->
    <a class="ticket" href="https://wa.me/56900000000" target="_blank" rel="noopener">
      <span class="icon">

      </span>
      <span class="text">
        <span class="label">Reserva por WhatsApp</span>
        <span class="sub">Agenda tu hora con Sofía, al toque</span>
      </span>
      <span class="arrow">→</span>
    </a>

    <a class="ticket" href="https://instagram.com/lordsbarbershop" target="_blank" rel="noopener">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"></circle></svg>
      </span>
      <span class="text">
        <span class="label">Instagram</span>
        <span class="sub">Mira nuestros cortes y trabajos</span>
      </span>
      <span class="arrow">→</span>
    </a>
  </nav>

  <section class="team">
    <p class="section-title">Nuestro equipo</p>
    <div class="team-grid">
      <!-- EDITA: reemplaza el src de cada foto por /fotos/rodrigo.jpg, etc. cuando las subas al repo -->
      <a class="barber" href="https://wa.me/56900000000?text=Hola%2C%20quiero%20agendar%20una%20hora%20con%20Rodrigo" target="_blank" rel="noopener">
        <img class="photo" src="https://ui-avatars.com/api/?name=Rodrigo&background=1F3329&color=C89B3C&bold=true&size=128" alt="Rodrigo">
        <span class="name">Rodrigo</span>
        <span class="cta">Agendar →</span>
      </a>
      <a class="barber" href="https://wa.me/56900000000?text=Hola%2C%20quiero%20agendar%20una%20hora%20con%20Sebasti%C3%A1n" target="_blank" rel="noopener">
        <img class="photo" src="https://ui-avatars.com/api/?name=Sebastian&background=1F3329&color=C89B3C&bold=true&size=128" alt="Sebastián">
        <span class="name">Sebastián</span>
        <span class="cta">Agendar →</span>
      </a>
      <a class="barber" href="https://wa.me/56900000000?text=Hola%2C%20quiero%20agendar%20una%20hora%20con%20Luis" target="_blank" rel="noopener">
        <img class="photo" src="https://ui-avatars.com/api/?name=Luis&background=1F3329&color=C89B3C&bold=true&size=128" alt="Luis">
        <span class="name">Luis</span>
        <span class="cta">Agendar →</span>
      </a>
    </div>
  </section>

  <footer>
    <div class="pole-stripe bottom" aria-hidden="true"></div>
    <p class="hours" style="margin-top:16px;">Lun – Sáb · 10:00 – 20:00</p>
  </footer>

</div>
</body>
</html>
